# Optional: MySQL when nothing listens on localhost:3306 (e.g. no XAMPP/Laragon).
# From backend/: docker compose up -d
# Then in .env use mysql and set DB_PASSWORD=salon_secret (match MYSQL_ROOT_PASSWORD below).
services:
  mysql:
    image: mysql:8.0
    container_name: salon-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: salon_secret
      MYSQL_DATABASE: salon_db
    volumes:
      - salon_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salon_mysql_data:
